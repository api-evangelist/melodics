aid: melodics
name: Melodics
description: >-
  Melodics is a New Zealand-based interactive music-learning application that
  teaches drums, MIDI keyboards, and pad controllers (finger drumming) through
  gamified, real-time lessons. It connects to electronic instruments and MIDI
  controllers to give immediate feedback on timing and accuracy, offering guided
  learning paths, song tutorials, and structured daily practice for beginner
  through advanced players across desktop and mobile. Melodics is a consumer
  edtech product and a portfolio company of 500 Global; it publishes no public
  developer API surface as of this enrichment pass.
